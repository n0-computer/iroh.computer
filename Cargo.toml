[package]
name = "iroh-computer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
time = { version = "0.3", features = ["formatting"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
