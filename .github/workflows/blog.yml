name: Blog content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check Dioxus components
        run: cargo check --locked --target wasm32-unknown-unknown
      - name: Validate posts and social-card references
        run: cargo test --locked --test blog --test contact --test highlight --test feeds --test prerender
      - name: Generate and validate RSS and sitemap XML
        run: |
          cargo run --locked --example export_feeds -- target/feed-check
          python3 scripts/check-feeds.py target/feed-check
