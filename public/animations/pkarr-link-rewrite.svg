<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">The browser plugin rewrites a pkarr link</title>
<desc id="desc">The public key remains unchanged as https://uinsazmmp47ejo8gs5dbc6rfxya14cgqhxmdqin8ae55w5aqnsio.pkarr.net becomes http://uinsazmmp47ejo8gs5dbc6rfxya14cgqhxmdqin8ae55w5aqnsio.pkarr.localhost:1234. Port 1234 is an example of the configured local gateway port.</desc>
<rect x="10" y="10" width="880" height="240" rx="12" fill="#fafafa" stroke="#d4d4d8"/>
<text x="35" y="43" font-family="Space Mono, monospace" font-size="13" fill="#71717a">Browser</text>
<rect x="35" y="68" width="830" height="61" rx="8" fill="#f3f4f6" stroke="#d4d4d8"/>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.0;0.31666666666666665;0.35000000000000003;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="55" y="105" font-family="Space Mono, monospace" font-size="15" fill="#71717a">https://</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.35000000000000003;0.3833333333333333;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="64" y="105" font-family="Space Mono, monospace" font-size="15" fill="#71717a">http://</text></g>
<text x="127" y="105" font-family="Space Mono, monospace" font-size="15" fill="#15803d">uinsazmmp47ejo8gs5dbc6rfxya14cgqhxmdqin8ae55w5aqnsio</text>
<text x="595" y="105" font-family="Space Mono, monospace" font-size="15" fill="#6366f1">.pkarr</text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.0;0.31666666666666665;0.35000000000000003;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="649" y="105" font-family="Space Mono, monospace" font-size="15" fill="#6366f1">.net</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.35000000000000003;0.3833333333333333;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="649" y="105" font-family="Space Mono, monospace" font-size="15" fill="#6366f1">.localhost</text><text x="739" y="105" font-family="Space Mono, monospace" font-size="15" fill="#2563eb">:1234</text></g>
<path d="M 127 138 V 146 H 595 V 138" fill="none" stroke="#15803d"/>
<text x="127" y="168" font-family="Space Mono, monospace" font-size="12" fill="#15803d">Ed25519 public key</text>
<g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.0;0.31666666666666665;0.35000000000000003;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="55" y="218" font-family="Space Mono, monospace" font-size="13" fill="#71717a">Shareable link</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.35000000000000003;0.3833333333333333;0.875;0.9166666666666666;1.0" dur="12s" repeatCount="indefinite"/><text x="55" y="218" font-family="Space Mono, monospace" font-size="13" fill="#2563eb">Local gateway</text><text x="240" y="218" font-family="Space Mono, monospace" font-size="12" fill="#71717a">1234 = configured gateway port</text></g>
</svg>
