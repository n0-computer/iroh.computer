<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Buzz community compute connected by iroh</title>
  <desc id="desc">Two community computers exchange inference directly over iroh while a Buzz relay provides membership and discovery without carrying model traffic.</desc>
  <defs>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ffd84d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="32" fill="#0b0b0b"/>
  <rect width="1200" height="630" rx="32" fill="url(#glow)"/>
  <rect width="1200" height="630" rx="32" fill="url(#dots)"/>

  <g transform="translate(60 48)">
    <g transform="translate(0 2)">
      <path d="M24 0 48 14v28L24 56 0 42V14z" fill="#ffd84d"/>
      <path d="M0 42 24 56v28L0 98-24 84V56z" fill="#ffbd24" transform="translate(0 -14)"/>
      <path d="M48 42 72 56v28L48 98 24 84V56z" fill="#ffb000" transform="translate(0 -14)"/>
    </g>
    <text x="104" y="36" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="3">BUZZ MESH</text>
    <text x="104" y="68" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="18">your community is your compute</text>
  </g>

  <g transform="translate(490 128)">
    <rect width="220" height="94" rx="20" fill="#171717" stroke="#525252" stroke-width="2"/>
    <g transform="translate(24 22)" fill="#ffd84d">
      <rect width="12" height="12" rx="2"/><rect x="17" width="12" height="12" rx="2"/><rect x="34" width="12" height="12" rx="2"/>
      <rect y="17" width="12" height="12" rx="2"/><rect x="17" y="17" width="12" height="12" rx="2"/><rect x="34" y="17" width="12" height="12" rx="2"/>
      <rect y="34" width="12" height="12" rx="2"/><rect x="17" y="34" width="12" height="12" rx="2"/><rect x="34" y="34" width="12" height="12" rx="2"/>
    </g>
    <text x="88" y="40" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Buzz relay</text>
    <text x="88" y="67" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="15">membership + discovery</text>
  </g>

  <path d="M515 224 C460 270 365 270 300 318" fill="none" stroke="#737373" stroke-width="3" stroke-dasharray="8 10"/>
  <path d="M685 224 C740 270 835 270 900 318" fill="none" stroke="#737373" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="600" y="257" text-anchor="middle" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">signed discovery notes</text>

  <g transform="translate(105 315)">
    <rect width="310" height="190" rx="22" fill="#171717" stroke="#404040" stroke-width="2"/>
    <rect x="25" y="26" width="260" height="112" rx="10" fill="#242424" stroke="#525252"/>
    <circle cx="53" cy="55" r="8" fill="#a855f7"/>
    <rect x="72" y="47" width="130" height="16" rx="8" fill="#525252"/>
    <rect x="43" y="79" width="190" height="12" rx="6" fill="#404040"/>
    <rect x="43" y="103" width="145" height="12" rx="6" fill="#404040"/>
    <path d="M0 159h310l34 31H-34z" fill="#262626" stroke="#525252" stroke-width="2"/>
    <text x="155" y="226" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">member's agent</text>
    <text x="155" y="251" text-anchor="middle" fill="#a3a3a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">127.0.0.1:9337/v1</text>
  </g>

  <g transform="translate(785 315)">
    <rect width="310" height="190" rx="22" fill="#171717" stroke="#404040" stroke-width="2"/>
    <rect x="28" y="26" width="254" height="112" rx="12" fill="#242424" stroke="#525252"/>
    <g transform="translate(54 47)">
      <rect width="70" height="70" rx="10" fill="#111" stroke="#ffd84d" stroke-width="2"/>
      <path d="M17 25h36M17 35h36M17 45h36M25 17v36M35 17v36M45 17v36" stroke="#ffd84d" stroke-width="2" opacity=".7"/>
    </g>
    <text x="151" y="68" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">shared model</text>
    <text x="151" y="94" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="15">opt-in compute</text>
    <circle cx="64" cy="164" r="7" fill="#22c55e"/>
    <text x="82" y="171" fill="#d4d4d4" font-family="system-ui, sans-serif" font-size="16">available to the community</text>
    <text x="155" y="226" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">member's workstation</text>
  </g>

  <path d="M426 442 C520 392 680 392 774 442" fill="none" stroke="url(#path)" stroke-width="9" stroke-linecap="round"/>
  <path d="m752 422 25 20-27 17" fill="none" stroke="#ffd84d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="451" y="456" width="298" height="43" rx="21.5" fill="#0b0b0b" stroke="#525252"/>
  <text x="600" y="483" text-anchor="middle" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">inference over iroh · QUIC</text>
  <text x="600" y="554" text-anchor="middle" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="17">The relay coordinates. The model traffic takes its own path.</text>
</svg>
