<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Buzz shared inference architecture</title>
  <desc id="desc">A local agent calls an OpenAI-compatible endpoint, which routes through MeshLLM and iroh to an opted-in community workstation. The Buzz relay separately supplies membership and signed discovery.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#7c3aed"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#737373"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#111111"/>
  <text x="60" y="64" fill="#fff" font-family="system-ui, sans-serif" font-size="29" font-weight="750">Inference stays off the Buzz relay</text>
  <text x="60" y="96" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="17">Control and data take separate paths.</text>

  <g transform="translate(430 126)">
    <rect width="340" height="102" rx="18" fill="#1c1c1c" stroke="#525252" stroke-width="2"/>
    <text x="170" y="42" text-anchor="middle" fill="#ffd84d" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Buzz relay</text>
    <text x="170" y="72" text-anchor="middle" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="16">membership · policy · signed discovery</text>
  </g>

  <path d="M520 229 268 325" fill="none" stroke="#737373" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#dashed-arrow)"/>
  <path d="M680 229 932 325" fill="none" stroke="#737373" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#dashed-arrow)"/>
  <rect x="499" y="252" width="202" height="34" rx="17" fill="#111"/>
  <text x="600" y="274" text-anchor="middle" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">control plane</text>

  <g transform="translate(52 340)">
    <rect width="225" height="150" rx="18" fill="#1c1c1c" stroke="#404040" stroke-width="2"/>
    <circle cx="42" cy="43" r="18" fill="#a855f7"/>
    <path d="M33 46h18M37 39h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="49" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Agent</text>
    <text x="28" y="92" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">OpenAI-compatible API</text>
    <text x="28" y="121" fill="#d4d4d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">127.0.0.1:9337/v1</text>
  </g>

  <g transform="translate(327 340)">
    <rect width="225" height="150" rx="18" fill="#1c1c1c" stroke="#404040" stroke-width="2"/>
    <text x="28" y="49" fill="#fff" font-family="system-ui, sans-serif" font-size="21" font-weight="700">MeshLLM</text>
    <text x="28" y="87" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">owner allowlist</text>
    <text x="28" y="114" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">model routing</text>
  </g>

  <g transform="translate(602 340)">
    <rect width="225" height="150" rx="18" fill="#1c1c1c" stroke="#7c3aed" stroke-width="2"/>
    <text x="28" y="49" fill="#c084fc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">iroh</text>
    <text x="28" y="87" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">authenticated QUIC</text>
    <text x="28" y="114" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">network path</text>
  </g>

  <g transform="translate(877 340)">
    <rect width="270" height="150" rx="18" fill="#1c1c1c" stroke="#ffd84d" stroke-width="2"/>
    <rect x="28" y="29" width="50" height="50" rx="8" fill="#111" stroke="#ffd84d"/>
    <path d="M38 46h30M38 55h30M45 38v31M55 38v31M65 38v31" stroke="#ffd84d" opacity=".8"/>
    <text x="96" y="52" fill="#fff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Community GPU</text>
    <text x="28" y="106" fill="#b3b3b3" font-family="system-ui, sans-serif" font-size="15">opted-in model serving</text>
  </g>

  <path d="M278 415h38" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M553 415h38" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M828 415h38" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="552" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">data plane · prompts and model responses</text>
</svg>
