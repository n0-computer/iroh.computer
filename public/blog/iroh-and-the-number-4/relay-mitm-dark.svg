    <circle cx="220" cy="264" r="1.5" fill="#fbbf24"/>
    <text x="200" y="285" text-anchor="middle"></text>
  </g>
  <g font-family="'Space Mono', monospace" font-size="10" fill="#a1a1aa">
    <text x="680" y="222" text-anchor="middle"></text>
    <polyline points="650,265 640,265 640,222" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="640" cy="220" r="1.5" fill="#a1a1aa"/>
    <polyline points="710,265 720,265 720,222" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="720" cy="220" r="1.5" fill="#a1a1aa"/>
