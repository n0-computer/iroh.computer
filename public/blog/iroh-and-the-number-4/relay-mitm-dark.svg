    <rect x="175" y="312" width="50" height="92" rx="9" fill="#27272a" stroke="#a5b4fc" stroke-width="1.5"/>
    <path d="M 184 315 L 193.0 315 Q 195.0 315 195.0 317 L 195.0 318 Q 195.0 320 196.0 320 L 204.0 320 Q 205.0 320 205.0 318 L 205.0 317 Q 205.0 315 207.0 315 L 216 315 A 6 6 0 0 1 222 321 L 222 395 A 6 6 0 0 1 216 401 L 184 401 A 6 6 0 0 1 178 395 L 178 321 A 6 6 0 0 1 184 315 Z" fill="none" stroke="#a5b4fc" stroke-width="1"/>
