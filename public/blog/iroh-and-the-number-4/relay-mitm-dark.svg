  <path d="M 200 230 C 200 120 280 66 408 66 L 472 66 C 600 66 680 120 680 230 L 680 312" fill="none" stroke="#60a5fa" stroke-width="12" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M 200 312 L 200 230 C 200 120 280 66 408 66 L 472 66 C 600 66 680 120 680 230 L 680 312" fill="none" stroke="#4ade80" stroke-width="2.5"/>
