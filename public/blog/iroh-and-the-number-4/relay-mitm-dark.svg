  <rect x="310" y="168" width="260" height="72" rx="6" fill="#27272a" stroke="#fbbf24" stroke-width="1.5"/>
  <g font-family="'Space Mono', monospace" font-size="12">
    <text x="322" y="188" fill="#fbbf24" font-weight="bold">attacker sees</text>
    <text x="322" y="208" fill="#f4f4f5">which endpoint ids talk</text>
    <text x="322" y="228" fill="#f4f4f5">packet sizes and timing</text>
  </g>
  <rect x="310" y="262" width="260" height="72" rx="6" fill="#27272a" stroke="#4ade80" stroke-width="1.5"/>
  <g font-family="'Space Mono', monospace" font-size="12">
    <text x="322" y="282" fill="#4ade80" font-weight="bold">attacker can't</text>
    <text x="322" y="302" fill="#f4f4f5">read or change payloads</text>
    <text x="322" y="322" fill="#f4f4f5">impersonate Alice or Bob</text>
  </g>
  <g font-family="'Space Mono', monospace" font-size="11" fill="#a1a1aa">
    <line x1="318" y1="356" x2="348" y2="356" stroke="#fbbf24" stroke-width="12" stroke-opacity="0.5"/>
    <text x="358" y="360">TLS to the attacker (forged cert)</text>
    <line x1="318" y1="380" x2="348" y2="380" stroke="#60a5fa" stroke-width="12" stroke-opacity="0.3"/>
    <text x="358" y="384">TLS to the relay (Web PKI)</text>
    <line x1="318" y1="404" x2="348" y2="404" stroke="#4ade80" stroke-width="2.5"/>
    <text x="358" y="408">end-to-end QUIC (Ed25519 keys)</text>
  </g>
</svg>
