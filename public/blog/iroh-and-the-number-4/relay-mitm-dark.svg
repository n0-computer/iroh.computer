    <line x1="447" y1="61" x2="447" y2="71" stroke="#a1a1aa" stroke-width="1"/>
    <line x1="452" y1="61" x2="452" y2="71" stroke="#a1a1aa" stroke-width="1"/>
    <line x1="457" y1="61" x2="457" y2="71" stroke="#a1a1aa" stroke-width="1"/>
    <text x="440" y="91" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#f4f4f5">relay</text>
  </g>
  <g font-family="'Space Mono', monospace" font-size="10" fill="#a1a1aa">
    <text x="200" y="222" text-anchor="middle"></text>
    <polyline points="170,265 160,265 160,222" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <circle cx="160" cy="220" r="1.5" fill="#a1a1aa"/>
