    <circle cx="414" cy="63" r="1.5" fill="#fbbf24"/>
    <circle cx="414" cy="69" r="1.5" fill="#a1a1aa"/>
    <line x1="432" y1="61" x2="432" y2="71" stroke="#a1a1aa" stroke-width="1"/>
