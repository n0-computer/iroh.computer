<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Where iroh relies on certificate chains</title>
  <desc id="desc">The connection from your endpoint to another endpoint is authenticated by the Ed25519 key alone, without any certificate chain. The connections to iroh infrastructure, the relay (relay connection, QAD and HTTPS probes) and the pkarr server (publish via HTTP PUT), use TLS with a CA certificate chain.</desc>
  <rect x="500" y="130" width="245" height="235" rx="12" fill="none" stroke="#71717a" stroke-dasharray="6 5"/>
  <g fill="none" stroke-width="3">
    <path d="M 200 168 C 365 168 365 65 530 65" stroke="#4ade80"/>
    <path d="M 200 192 C 365 192 365 215 530 215" stroke="#fbbf24"/>
    <path d="M 200 214 C 365 214 365 317 530 317" stroke="#fbbf24"/>
  </g>
  <g stroke="#71717a" fill="#27272a">
    <rect x="30" y="150" width="170" height="80" rx="10"/>
    <rect x="530" y="30" width="200" height="70" rx="10"/>
    <rect x="530" y="170" width="200" height="90" rx="10"/>
    <rect x="530" y="285" width="200" height="65" rx="10"/>
  </g>
  <g font-family="Space Mono, monospace" text-anchor="middle">
    <text x="115" y="196" font-size="16" fill="#f4f4f5">Your endpoint</text>
    <text x="630" y="62" font-size="16" fill="#f4f4f5">Other endpoint</text>
    <text x="630" y="84" font-size="13" fill="#a1a1aa">any peer</text>
    <text x="630" y="198" font-size="16" fill="#f4f4f5">Relay</text>
    <text x="630" y="222" font-size="13" fill="#a1a1aa">relay connection</text>
    <text x="630" y="244" font-size="13" fill="#a1a1aa">QAD + HTTPS probes</text>
    <text x="630" y="312" font-size="16" fill="#f4f4f5">pkarr server</text>
    <text x="630" y="334" font-size="13" fill="#a1a1aa">publish (http PUT)</text>
  </g>
  <g font-family="Space Mono, monospace" font-size="13">
    <text x="365" y="55" fill="#4ade80">Ed25519 key, no CA</text>
    <text x="378" y="203" fill="#fbbf24">TLS + CA chain</text>
    <text x="378" y="340" fill="#fbbf24">TLS + CA chain</text>
    <text x="515" y="153" fill="#a1a1aa">iroh infrastructure</text>
  </g>
</svg>
