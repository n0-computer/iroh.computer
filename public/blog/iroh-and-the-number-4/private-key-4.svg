<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" role="img" aria-labelledby="title desc">
  <title id="title">A P-384 private key that is the number 4</title>
  <desc id="desc">OpenSSL text dump of a P-384 elliptic curve key. The 48-byte private key is all zeros except for the last byte, which is 04. The public key below it looks like random bytes.</desc>
  <rect x="10" y="10" width="660" height="436" rx="12" fill="#f3f4f6"/>
  <g font-family="Space Mono, monospace" font-size="16">
    <text x="40" y="56" fill="#888">$ openssl ec -noout -text</text>
    <text x="40" y="80" fill="#555">Private-Key: (384 bit field, 192 bit security level)</text>
    <text x="40" y="104" fill="#555">priv:</text>
    <text x="80" y="128" fill="#9ca3af">00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:</text>
    <text x="80" y="152" fill="#9ca3af">00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:</text>
    <text x="80" y="176" fill="#9ca3af">00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:<tspan fill="#d97706" font-weight="bold">04</tspan></text>
    <text x="40" y="200" fill="#555">pub:</text>
    <text x="80" y="224" fill="#333">04:13:82:51:cd:52:ac:92:98:c1:c8:aa:d9:77:32:1d:</text>
    <text x="80" y="248" fill="#333">eb:97:e7:09:bd:0b:4c:a0:ac:a5:5d:c8:ad:51:dc:fc:</text>
    <text x="80" y="272" fill="#333">9d:15:89:a1:59:7e:3a:51:20:e1:ef:d6:31:c6:3e:18:</text>
    <text x="80" y="296" fill="#333">35:ca:ca:e2:98:69:a6:2e:16:31:e8:a2:81:81:ab:56:</text>
    <text x="80" y="320" fill="#333">61:6d:c4:5d:91:8a:bc:09:f3:ab:0e:63:cf:79:2a:a4:</text>
    <text x="80" y="344" fill="#333">dc:ed:73:87:be:37:bb:a5:69:54:9f:1c:02:b2:70:ed:</text>
    <text x="80" y="368" fill="#333">67</text>
    <text x="40" y="392" fill="#555">ASN1 OID: secp384r1</text>
    <text x="40" y="416" fill="#555">NIST CURVE: P-384</text>
  </g>
</svg>
